<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <!-- GitHub Window -->
  <rect width="1000" height="580" rx="10" fill="url(#gitBg)" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- GitHub Header Bar -->
  <rect width="1000" height="48" rx="10" fill="#161b22" />
  <rect y="36" width="1000" height="12" fill="#161b22" />
  <circle cx="25" cy="24" r="5" fill="#ff5f56" />
  <circle cx="43" cy="24" r="5" fill="#ffbd2e" />
  <circle cx="61" cy="24" r="5" fill="#27c93f" />
  <text x="500" y="28" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle" font-weight="600">GitHub Actions — Workflow Run #14 (DevOps CI/CD Pipeline)</text>

  <!-- Repo Title Breadcrumb -->
  <g transform="translate(35, 70)">
    <text x="0" y="0" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">student-user / devpulse-web-portal</text>
    <rect x="250" y="-14" width="55" height="20" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="277" y="0" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Public</text>
  </g>

  <!-- Workflow Run Status Banner -->
  <g transform="translate(35, 95)">
    <rect width="930" height="110" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    
    <!-- Big Checkmark -->
    <circle cx="40" cy="40" r="20" fill="#238636" />
    <path d="M30 40 L37 47 L50 33" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Run Summary -->
    <text x="75" y="32" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">DevOps CI/CD Pipeline succeeded</text>
    <text x="75" y="55" fill="#8b949e" font-family="sans-serif" font-size="12">Commit <tspan fill="#58a6ff" font-family="monospace">c4b18f9</tspan> — docs: comprehensive README.md with screenshots &amp; tests (main branch)</text>
    <text x="75" y="78" fill="#8b949e" font-family="sans-serif" font-size="12">Triggered by <tspan font-weight="600" fill="#c9d1d9">push</tspan> • Run duration: <tspan font-weight="600" fill="#c9d1d9">1m 24s</tspan> • Artifacts: <tspan fill="#58a6ff">docker-image-v1.4.tar.gz</tspan></text>
  </g>

  <!-- Job DAG Flowchart -->
  <g transform="translate(35, 230)">
    <text x="0" y="0" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="600">Jobs Execution Graph</text>
    
    <g transform="translate(0, 15)">
      <rect width="930" height="300" rx="8" fill="#0d1117" stroke="#30363d"/>

      <!-- Job 1 -->
      <g transform="translate(30, 30)">
        <rect width="250" height="90" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="10" fill="#238636"/>
        <path d="M21 30 L24 33 L29 27" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="45" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="13" font-weight="600">lint-and-validate</text>
        <text x="45" y="54" fill="#8b949e" font-family="sans-serif" font-size="11">Duration: 14s</text>
        <text x="25" y="75" fill="#238636" font-family="monospace" font-size="10">✓ ESLint &amp; HTML5 Check</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <line x1="285" y1="75" x2="335" y2="75" stroke="#238636" stroke-width="2"/>
      <polygon points="340,75 332,71 332,79" fill="#238636"/>

      <!-- Job 2 -->
      <g transform="translate(340, 30)">
        <rect width="250" height="90" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="10" fill="#238636"/>
        <path d="M21 30 L24 33 L29 27" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="45" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="13" font-weight="600">automated-testing</text>
        <text x="45" y="54" fill="#8b949e" font-family="sans-serif" font-size="11">Duration: 22s</text>
        <text x="25" y="75" fill="#238636" font-family="monospace" font-size="10">✓ 11/11 Tests Passed</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <line x1="595" y1="75" x2="645" y2="75" stroke="#238636" stroke-width="2"/>
      <polygon points="650,75 642,71 642,79" fill="#238636"/>

      <!-- Job 3 -->
      <g transform="translate(650, 30)">
        <rect width="250" height="90" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="10" fill="#238636"/>
        <path d="M21 30 L24 33 L29 27" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="45" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="13" font-weight="600">docker-build</text>
        <text x="45" y="54" fill="#8b949e" font-family="sans-serif" font-size="11">Duration: 48s</text>
        <text x="25" y="75" fill="#238636" font-family="monospace" font-size="10">✓ Docker Image &amp; Health Probe</text>
      </g>

      <!-- Step Details Subpanel -->
      <g transform="translate(30, 145)">
        <rect width="870" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="20" y="25" fill="#c9d1d9" font-family="monospace" font-size="12" font-weight="600">Step Logs &amp; Execution Output:</text>
        <text x="20" y="48" fill="#3fb950" font-family="monospace" font-size="11">✓ Set up job (ubuntu-latest)</text>
        <text x="20" y="68" fill="#3fb950" font-family="monospace" font-size="11">✓ Run actions/checkout@v4 (git commit c4b18f9)</text>
        <text x="20" y="88" fill="#3fb950" font-family="monospace" font-size="11">✓ Validate HTML Structure &amp; Dockerfile: Syntax OK</text>
        <text x="20" y="108" fill="#3fb950" font-family="monospace" font-size="11">✓ Build Docker image: devpulse-web:latest (Size: 24.8MB)</text>
        <text x="20" y="125" fill="#3fb950" font-family="monospace" font-size="11">✓ Container health verification probe: HTTP 200 OK</text>
      </g>
    </g>
  </g>
</svg>
