<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1000" height="600" rx="12" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Title Bar -->
  <rect width="1000" height="42" rx="12" fill="#161f30" />
  <rect y="30" width="1000" height="12" fill="#161f30" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="500" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle" font-weight="500">Progress Phase 1 — Project Wireframe &amp; Layout Architecture</text>

  <!-- Content Layout -->
  <!-- Header Wireframe -->
  <rect x="40" y="65" width="920" height="50" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="4 4"/>
  <rect x="60" y="78" width="120" height="24" rx="4" fill="#3b82f6" opacity="0.8"/>
  <text x="120" y="94" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">DevPulse Brand</text>
  
  <rect x="650" y="78" width="80" height="24" rx="4" fill="#374151"/>
  <rect x="745" y="78" width="80" height="24" rx="4" fill="#374151"/>
  <rect x="840" y="78" width="100" height="24" rx="4" fill="#10b981" opacity="0.8"/>
  <text x="890" y="94" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">CI/CD Active</text>

  <!-- Hero Wireframe -->
  <rect x="40" y="130" width="920" height="110" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="4 4"/>
  <rect x="250" y="150" width="500" height="28" rx="4" fill="#374151"/>
  <text x="500" y="170" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">HERO: Automated DevOps Pipeline &amp; Cloud Infrastructure Portal</text>
  <rect x="320" y="190" width="360" height="16" rx="4" fill="#2d3748"/>
  <rect x="380" y="215" width="240" height="14" rx="4" fill="#2d3748"/>

  <!-- Pipeline Stages Wireframe -->
  <text x="40" y="268" fill="#e5e7eb" font-family="sans-serif" font-size="15" font-weight="600">STAGE 1 PROGRESS: PIPELINE ARCHITECTURE</text>
  
  <g transform="translate(40, 285)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#172033" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="35" fill="#3b82f6" font-family="sans-serif" font-size="20" text-anchor="middle">📥</text>
    <text x="80" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">1. Source Checkout</text>
    <text x="80" y="85" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">Git VCS Clone</text>

    <!-- Arrow -->
    <line x1="165" y1="55" x2="185" y2="55" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2 -->
    <rect x="190" y="0" width="160" height="110" rx="8" fill="#172033" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="270" y="35" fill="#3b82f6" font-family="sans-serif" font-size="20" text-anchor="middle">🔍</text>
    <text x="270" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">2. Code Linting</text>
    <text x="270" y="85" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">Syntax Validation</text>

    <!-- Stage 3 -->
    <rect x="380" y="0" width="160" height="110" rx="8" fill="#172033" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="460" y="35" fill="#3b82f6" font-family="sans-serif" font-size="20" text-anchor="middle">🧪</text>
    <text x="460" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">3. Automated Tests</text>
    <text x="460" y="85" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">Unit &amp; Integration</text>

    <!-- Stage 4 -->
    <rect x="570" y="0" width="160" height="110" rx="8" fill="#172033" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="650" y="35" fill="#3b82f6" font-family="sans-serif" font-size="20" text-anchor="middle">🐳</text>
    <text x="650" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">4. Docker Build</text>
    <text x="650" y="85" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">Container Image</text>

    <!-- Stage 5 -->
    <rect x="760" y="0" width="160" height="110" rx="8" fill="#172033" stroke="#10b981" stroke-width="1.5"/>
    <text x="840" y="35" fill="#10b981" font-family="sans-serif" font-size="20" text-anchor="middle">🚀</text>
    <text x="840" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">5. Deployment</text>
    <text x="840" y="85" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">Port 8080 Live</text>
  </g>

  <!-- Metric Wireframe Boxes -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="215" height="130" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12">METRIC MODULE 1</text>
    <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">CPU Usage</text>
    <rect x="20" y="85" width="175" height="8" rx="4" fill="#374151"/>

    <rect x="235" y="0" width="215" height="130" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="255" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12">METRIC MODULE 2</text>
    <text x="255" y="65" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">Memory RAM</text>
    <rect x="255" y="85" width="175" height="8" rx="4" fill="#374151"/>

    <rect x="470" y="0" width="215" height="130" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="490" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12">METRIC MODULE 3</text>
    <text x="490" y="65" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">API Latency</text>
    <rect x="490" y="85" width="175" height="8" rx="4" fill="#374151"/>

    <rect x="705" y="0" width="215" height="130" rx="8" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="725" y="30" fill="#9ca3af" font-family="sans-serif" font-size="12">METRIC MODULE 4</text>
    <text x="725" y="65" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">System Uptime</text>
    <rect x="725" y="85" width="175" height="8" rx="4" fill="#374151"/>
  </g>
</svg>
