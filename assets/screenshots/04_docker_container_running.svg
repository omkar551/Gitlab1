<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <!-- Terminal Window Frame -->
  <rect width="1000" height="560" rx="10" fill="#0c1017" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Terminal Window Header -->
  <rect width="1000" height="40" rx="10" fill="#161b22"/>
  <rect y="28" width="1000" height="12" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">bash / powershell — docker container runtime verification</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 65)">
    <!-- Command 1: docker build -->
    <text x="0" y="0" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">user@devops-node:~/devpulse$ <tspan fill="#f0f6fc">docker build -t devpulse-web:v1.4.0 .</tspan></text>
    <text x="0" y="24" fill="#8b949e" font-family="monospace" font-size="12">[+] Building 4.2s (9/9) FINISHED</text>
    <text x="0" y="44" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [internal] load build definition from Dockerfile                     0.0s</text>
    <text x="0" y="64" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [internal] load .dockerignore                                      0.0s</text>
    <text x="0" y="84" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [1/4] FROM docker.io/library/nginx:alpine                          1.1s</text>
    <text x="0" y="104" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [2/4] COPY index.html styles.css app.js /usr/share/nginx/html/     0.3s</text>
    <text x="0" y="124" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [3/4] COPY assets/ /usr/share/nginx/html/assets/                   0.2s</text>
    <text x="0" y="144" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; [4/4] COPY nginx.conf /etc/nginx/conf.d/default.conf               0.1s</text>
    <text x="0" y="164" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; exporting to image: sha256:d84f91b72a4...                         0.4s</text>
    <text x="0" y="184" fill="#3fb950" font-family="monospace" font-size="12"> =&gt; naming to docker.io/library/devpulse-web:v1.4.0                    0.0s</text>

    <!-- Command 2: docker images -->
    <text x="0" y="225" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">user@devops-node:~/devpulse$ <tspan fill="#f0f6fc">docker images | grep devpulse</tspan></text>
    <text x="0" y="248" fill="#e6edf3" font-family="monospace" font-size="12"><tspan fill="#79c0ff">REPOSITORY</tspan>          <tspan fill="#79c0ff">TAG</tspan>       <tspan fill="#79c0ff">IMAGE ID</tspan>       <tspan fill="#79c0ff">CREATED</tspan>         <tspan fill="#79c0ff">SIZE</tspan></text>
    <text x="0" y="268" fill="#e6edf3" font-family="monospace" font-size="12">devpulse-web        v1.4.0    d84f91b72a4    2 minutes ago   24.8MB</text>
    <text x="0" y="288" fill="#e6edf3" font-family="monospace" font-size="12">devpulse-web        latest    d84f91b72a4    2 minutes ago   24.8MB</text>

    <!-- Command 3: docker run & ps -->
    <text x="0" y="330" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">user@devops-node:~/devpulse$ <tspan fill="#f0f6fc">docker run -d --name devpulse-frontend -p 8080:80 devpulse-web:v1.4.0</tspan></text>
    <text x="0" y="352" fill="#3fb950" font-family="monospace" font-size="12">c91e4b857a2f18390d79c6fa029f626b4827038e833b70868a8837a2b972e259</text>

    <!-- Command 4: docker ps -->
    <text x="0" y="390" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">user@devops-node:~/devpulse$ <tspan fill="#f0f6fc">docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"</tspan></text>
    <text x="0" y="412" fill="#79c0ff" font-family="monospace" font-size="12">NAMES               STATUS                    PORTS</text>
    <text x="0" y="432" fill="#3fb950" font-family="monospace" font-size="12">devpulse-frontend   Up 2 minutes (healthy)    0.0.0.0:8080-&gt;80/tcp</text>

    <!-- Command 5: curl probe -->
    <text x="0" y="470" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="700">user@devops-node:~/devpulse$ <tspan fill="#f0f6fc">curl -s http://localhost:8080/api/health</tspan></text>
    <text x="0" y="490" fill="#e6edf3" font-family="monospace" font-size="12">{"status":"UP","version":"1.4.0","service":"devpulse-web","checks":{"docker":"HEALTHY","ci_cd":"ACTIVE"}}</text>
  </g>
</svg>
